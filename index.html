<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%86</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%86</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- Twemoji: muestra las banderas como imagenes para que se vean en Windows tambien -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

/* Twemoji: las banderas se convierten en <img>; que escalen como el texto */
img.emoji {
  height: 1em;
  width: 1em;
  margin: 0 0.05em 0 0.1em;
  vertical-align: -0.1em;
  display: inline-block;
}

:root {
  --primary: #8b1538;
  --primary-light: #c62054;
  --secondary: #1a2744;
  --accent: #d4a843;
  --gold: #ffd700;
  --success: #22c55e;
  --danger: #ef4444;
  --bg-dark: #0a0e1a;
  --bg-card: rgba(255,255,255,0.06);
  --bg-card-hover: rgba(255,255,255,0.1);
  --text: #e8e8f0;
  --text-muted: #8b8ba3;
  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.12);
  --radius: 16px;
  --radius-sm: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 20% 50%, rgba(139,21,56,0.15) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(26,39,68,0.3) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(212,168,67,0.08) 0%, transparent 50%);
  z-index: -1;
  animation: bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat {
  0%,100% { transform: translate(0,0) rotate(0deg); }
  33% { transform: translate(2%,-2%) rotate(1deg); }
  66% { transform: translate(-1%,1%) rotate(-1deg); }
}

/* ===== NAVBAR ===== */
.navbar {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  backdrop-filter: blur(20px);
  background: rgba(10,14,26,0.85);
  border-bottom: 1px solid var(--glass-border);
  padding: 0 2rem;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
}

.navbar-brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.15rem;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  cursor: pointer;
}

.navbar-brand span.ball { font-size: 1.5rem; -webkit-text-fill-color: initial; }

.nav-tabs {
  display: flex; gap: 4px;
}

.nav-tab {
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: all 0.3s;
  border: none;
  background: none;
  position: relative;
}

.nav-tab:hover { color: var(--text); background: var(--glass); }
.nav-tab.active {
  color: var(--accent);
  background: rgba(212,168,67,0.12);
}
.nav-tab.active::after {
  content:''; position:absolute; bottom:-1px; left:20%; right:20%;
  height:2px; background: var(--accent); border-radius:2px;
}

.user-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
}

.user-badge .avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700;
}

/* ===== MAIN ===== */
main {
  margin-top: 64px;
  padding: 2rem;
  max-width: 1400px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== HERO / LOGIN ===== */
.hero-section {
  text-align: center;
  padding: 4rem 1rem;
  position: relative;
}

.hero-section h1 {
  font-size: clamp(2.2rem, 6vw, 4rem);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 0.5rem;
}

.hero-section h1 .gradient-text {
  background: linear-gradient(135deg, var(--accent), var(--gold), #fff, var(--accent));
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 4s ease-in-out infinite;
}

@keyframes shimmer {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.hero-section .subtitle {
  font-size: 1.15rem;
  color: var(--text-muted);
  margin-bottom: 2rem;
}

.hero-section .host-flags {
  font-size: 2.5rem;
  margin-bottom: 1.5rem;
  letter-spacing: 10px;
}

/* ===== AUTH FORM ===== */
.auth-container {
  max-width: 420px;
  margin: 0 auto;
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 2rem;
}

.auth-container h2 {
  font-size: 1.4rem;
  margin-bottom: 1.5rem;
  text-align: center;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input, .form-group select {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.3s;
}

.form-group input:focus, .form-group select:focus {
  border-color: var(--accent);
}

.form-group select option {
  background: var(--secondary);
  color: var(--text);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 28px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  width: 100%;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(139,21,56,0.4);
}

.btn-gold {
  background: linear-gradient(135deg, var(--accent), var(--gold));
  color: #1a1a2e;
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(212,168,67,0.4);
}

.btn-sm {
  padding: 8px 16px;
  font-size: 0.8rem;
  border-radius: 8px;
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--glass-border);
  color: var(--text);
}

.btn-outline:hover {
  background: var(--glass);
}

.auth-toggle {
  text-align: center;
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.auth-toggle a {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}

/* ===== SECTIONS ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.section-header h2 {
  font-size: 1.6rem;
  font-weight: 700;
}

.section-header h2 span {
  color: var(--accent);
}

/* ===== STATS BAR ===== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 1.2rem;
  text-align: center;
  transition: transform 0.3s, border-color 0.3s;
}

.stat-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.stat-card .stat-value {
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stat-card .stat-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

/* ===== GROUPS GRID ===== */
.groups-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.2rem;
  margin-bottom: 2rem;
}

.group-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.3s, border-color 0.3s;
}

.group-card:hover {
  transform: translateY(-3px);
  border-color: rgba(212,168,67,0.3);
}

.group-card-header {
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(139,21,56,0.3), rgba(26,39,68,0.3));
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.group-card-header h3 {
  font-size: 1rem;
  font-weight: 700;
}

.group-card-header .group-letter {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.9rem;
}

.group-teams {
  padding: 8px;
}

.team-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  transition: background 0.2s;
}

.team-row:hover {
  background: rgba(255,255,255,0.04);
}

.team-flag {
  font-size: 1.6rem;
  width: 36px;
  text-align: center;
}

.team-name {
  flex: 1;
  font-size: 0.9rem;
  font-weight: 500;
}

.team-pos {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700;
  background: rgba(255,255,255,0.08);
  color: var(--text-muted);
}

.team-pos.q { background: rgba(34,197,94,0.2); color: var(--success); }
.team-pos.t { background: rgba(212,168,67,0.2); color: var(--accent); }

/* ===== MATCH PREDICTIONS ===== */
.matches-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1rem;
}

.match-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  transition: all 0.3s;
}

.match-card:hover {
  border-color: rgba(212,168,67,0.3);
}

.match-card.saved {
  border-color: rgba(34,197,94,0.3);
}

.match-card.locked {
  opacity: 0.7;
  border-color: rgba(239,68,68,0.25);
}

.match-card.locked input {
  pointer-events: none;
  opacity: 0.5;
}

.lock-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.lock-badge.locked {
  background: rgba(239,68,68,0.15);
  color: var(--danger);
}

.lock-badge.closing {
  background: rgba(245,158,11,0.15);
  color: #f59e0b;
  animation: pulse 2s ease-in-out infinite;
}

.lock-badge.open {
  background: rgba(34,197,94,0.1);
  color: var(--success);
}

@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.6; }
}

.match-datetime {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.match-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.match-meta .round-badge {
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(139,21,56,0.2);
  color: var(--primary-light);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-size: 0.7rem;
}

.match-teams {
  display: flex;
  align-items: center;
  gap: 10px;
}

.match-team {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}

.match-team.away {
  flex-direction: row-reverse;
  text-align: right;
}

.match-team .flag { font-size: 1.8rem; }
.match-team .name { font-size: 0.9rem; font-weight: 600; }

.match-score {
  display: flex;
  align-items: center;
  gap: 6px;
}

.match-score input {
  width: 44px; height: 44px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: 700;
  font-family: inherit;
  border: 2px solid var(--glass-border);
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  outline: none;
  transition: border-color 0.3s;
}

.match-score input:focus {
  border-color: var(--accent);
  background: rgba(212,168,67,0.08);
}

.match-score .vs {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
}

.match-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
  gap: 8px;
}

/* ===== KNOCKOUT BRACKET ===== */
.bracket-section {
  overflow-x: auto;
  padding-bottom: 1rem;
}

.bracket {
  display: flex;
  gap: 2rem;
  min-width: max-content;
  padding: 1rem 0;
}

.bracket-round {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  min-width: 220px;
}

.bracket-round-title {
  text-align: center;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  padding-bottom: 8px;
  border-bottom: 2px solid rgba(212,168,67,0.2);
  margin-bottom: 8px;
}

.bracket-match {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  transition: border-color 0.3s;
}

.bracket-match:hover {
  border-color: rgba(212,168,67,0.3);
}

.bracket-team {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.2s;
  font-size: 0.85rem;
}

.bracket-team:first-child {
  border-bottom: 1px solid var(--glass-border);
}

.bracket-team:hover {
  background: rgba(255,255,255,0.06);
}

.bracket-team.selected {
  background: rgba(34,197,94,0.12);
}

.bracket-team .flag { font-size: 1.2rem; }
.bracket-team .name { flex:1; font-weight: 500; }

.bracket-team .pick-indicator {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
  transition: all 0.3s;
}

.bracket-team.selected .pick-indicator {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

/* ===== LEADERBOARD ===== */
.leaderboard-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
}

.leaderboard-table thead th {
  padding: 10px 16px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  font-weight: 600;
  text-align: left;
}

.leaderboard-table tbody tr {
  background: var(--bg-card);
  transition: all 0.3s;
}

.leaderboard-table tbody tr:hover {
  background: var(--bg-card-hover);
  transform: translateX(4px);
}

.leaderboard-table tbody td {
  padding: 14px 16px;
  font-size: 0.9rem;
}

.leaderboard-table tbody tr td:first-child {
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}

.leaderboard-table tbody tr td:last-child {
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.rank-badge {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem;
  background: rgba(255,255,255,0.08);
}

.rank-badge.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a2e; }
.rank-badge.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #1a1a2e; }
.rank-badge.bronze { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }

.player-info {
  display: flex; align-items: center; gap: 10px;
}

.player-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
}

.points-display {
  font-weight: 800;
  font-size: 1.1rem;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
  min-width: 100px;
}

.progress-bar .fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.5s;
}

/* ===== RULES PANEL ===== */
.rules-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.2rem;
}

.rule-card {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 1.5rem;
}

.rule-card h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.rule-card h3 .icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}

.rule-card ul {
  list-style: none;
}

.rule-card ul li {
  padding: 6px 0;
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex; align-items: flex-start; gap: 8px;
}

.rule-card ul li::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
  flex-shrink: 0;
}

.points-table {
  width: 100%;
  margin-top: 8px;
}

.points-table td {
  padding: 8px 0;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--glass-border);
}

.points-table td:last-child {
  text-align: right;
  font-weight: 700;
  color: var(--accent);
}

/* ===== CHAMPION PICK ===== */
.champion-pick {
  background: linear-gradient(135deg, rgba(139,21,56,0.15), rgba(212,168,67,0.1));
  border: 1px solid rgba(212,168,67,0.2);
  border-radius: var(--radius);
  padding: 2rem;
  text-align: center;
  margin-bottom: 2rem;
}

.champion-pick h3 {
  font-size: 1.3rem;
  margin-bottom: 0.5rem;
}

.champion-pick p {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-bottom: 1.5rem;
}

.champion-select-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  max-width: 900px;
  margin: 0 auto;
}

.champion-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.3s;
  font-size: 0.82rem;
  font-weight: 500;
}

.champion-option:hover {
  border-color: var(--accent);
  background: rgba(212,168,67,0.08);
}

function generateGroupMatches() {
  const matches = [];
  let id = 1;
  for (const [group, teams] of Object.entries(GROUPS)) {
    for (let i = 0; i < teams.length; i++) {
      for (let j = i + 1; j < teams.length; j++) {
        const h = teams[i].code, a = teams[j].code;
        const dt = GROUP_FIXTURE_DATES[h + '_' + a] || GROUP_FIXTURE_DATES[a + '_' + h] || null;
        matches.push({
          id: id++,
          group,
          round: 'groups',
          home: teams[i],
          away: teams[j],
          datetime: dt  // fecha oficial del fixture FIFA 2026
        });
      }
    }
  }
  return matches;
}

const GROUP_MATCHES = generateGroupMatches();

// Fecha efectiva de un partido: la oficial importada (state.groupDates) o null.
// Si no hay fecha confirmada, el partido NO se bloquea (evita cierres por fechas falsas).
// Hora CONFIABLE: Date.now() usa el reloj local, que el usuario puede atrasar
// para burlar el cierre de predicciones. Firebase nos da el desfase real contra
// la hora del servidor (/.info/serverTimeOffset); al sumarlo obtenemos la hora
// del servidor aunque el dispositivo tenga el reloj cambiado.
let serverTimeOffset = 0;
function serverNow() {
  return Date.now() + serverTimeOffset;
}

function getMatchDate(match) {
  if (state.groupDates && state.groupDates[match.id]) return state.groupDates[match.id];
  return match.datetime || null;
}

function isMatchLocked(match) {
  const dt = getMatchDate(match);
  if (!dt) return false;
  const kickoff = new Date(dt).getTime();
  const lockTime = kickoff - (LOCK_HOURS * 60 * 60 * 1000);
  return serverNow() >= lockTime;
}

function getMatchLockStatus(match) {
  const dt = getMatchDate(match);
  if (!dt) return { status: 'open', label: 'Por confirmar', timeLeft: '' };
  const now = serverNow();
  const kickoff = new Date(dt).getTime();
  const lockTime = kickoff - (LOCK_HOURS * 60 * 60 * 1000);
  const msLeft = lockTime - now;

  if (now >= kickoff) return { status: 'locked', label: 'Jugado', timeLeft: '' };
  if (now >= lockTime) return { status: 'locked', label: 'Bloqueado', timeLeft: '' };

  const hoursLeft = msLeft / (1000 * 60 * 60);
  if (hoursLeft <= 24) {
    const h = Math.floor(hoursLeft);
    const m = Math.floor((hoursLeft - h) * 60);
    return { status: 'closing', label: `Cierra en ${h}h ${m}m`, timeLeft: `${h}h ${m}m` };
  }

  const days = Math.floor(hoursLeft / 24);
  return { status: 'open', label: `Faltan ${days}d`, timeLeft: `${days} dias` };
}

function formatMatchDate(datetime) {
  if (!datetime) return '';
  const d = new Date(datetime);
  const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
  return d.toLocaleDateString('es', opts);
}

function isChampionDeadlinePassed() {
  return serverNow() >= new Date(CHAMPION_DEADLINE).getTime();
}

function getDeadlineCountdown(deadline) {
  const ms = new Date(deadline).getTime() - serverNow();
  if (ms <= 0) return { passed: true, label: 'Cerrado' };
  const days = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  if (days > 0) return { passed: false, label: `${days}d ${hours}h restantes` };
  if (hours > 0) return { passed: false, label: `${hours}h ${mins}m restantes` };
  return { passed: false, label: `${mins}m restantes` };
}

function initFirebaseListeners() {
  // Sincronizar con la hora del servidor de Firebase. Si el usuario cambia el
  // reloj de su dispositivo, este desfase lo compensa y el cierre de
  // predicciones sigue usando la hora real.
  db.ref('/.info/serverTimeOffset').on('value', snap => {
    const off = snap.val();
    if (typeof off === 'number') {
      serverTimeOffset = off;
      // Repintar para que los candados/contadores reflejen la hora correcta
      if (['predictions', 'bracket', 'dashboard', 'home'].includes(state.view)) render();
    }
  });

  db.ref('users').on('value', snap => {
    const data = snap.val();
    if (data) {
      state.users = Object.values(data);
      saveState();
      if (state.view === 'leaderboard') render();
    }
  });

  // Predicciones: cada dispositivo escucha SOLO la suya (evita descargar
  // todas las predicciones de todos en cada cambio = ahorra muchisimo ancho de banda)
  subscribeMyPredictions();

  db.ref('config/apiKey').on('value', snap => {
    const key = snap.val();
    if (key) { state.apiKey = key; saveState(); }
  });

  db.ref('approvedEmails').on('value', snap => {
    const data = snap.val();
    if (data) {
      state.approvedEmails = data;
      saveState();
    }
  });

  db.ref('results').on('value', snap => {
    const data = snap.val();
    if (data) {
      state.results = data;
      saveState();
      const needsUpdate = ['predictions', 'leaderboard', 'admin'];
      if (needsUpdate.includes(state.view)) render();
      toast('Resultados actualizados en tiempo real', 'info');
    }
  });

  db.ref('groupDates').on('value', snap => {
    const data = snap.val();
    state.groupDates = data || {};
    saveState();
    if (['predictions', 'admin'].includes(state.view)) render();
  });

  db.ref('knockout').on('value', snap => {
    const data = snap.val();
    state.knockout = data || {};
    saveState();
    if (['bracket', 'admin', 'dashboard'].includes(state.view)) render();
  });

  db.ref('knockoutResults').on('value', snap => {
    const data = snap.val();
    state.knockoutResults = data || {};
    saveState();
    if (['bracket', 'leaderboard', 'admin', 'dashboard'].includes(state.view)) render();
  });
}

  if (!firebaseReady || !state.currentUser) return;

  myPredRef = db.ref('predictions/' + state.currentUser.id);
  myPredRef.on('value', snap => {

    if (data) {
      data.matches = normalizeMatches(data.matches);

      saveState();
      // Repintar cuando los datos llegan de la nube (red lenta / otro dispositivo),

      if (!editing && ['predictions', 'bracket', 'dashboard', 'home'].includes(state.view)) {

      }

  });
}

async function hashPin(pin) {
  const encoder = new TextEncoder();
  const data = encoder.encode(pin + '_polla2026_salt');
  const buffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===== LIVE SCORES API =====
// football-data.org free tier: 10 req/min, competition code "WC"
// La API key se guarda en state.apiKey (configurada desde Admin, NO en codigo fuente)
let liveScoresInterval = null;
let lastFetchTime = null;

async function fetchLiveScores() {
  const apiKey = state.apiKey;
  if (!apiKey) return;

  try {
    const resp = await fetch('https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED,IN_PLAY,PAUSED', {
      headers: { 'X-Auth-Token': apiKey }
    });

    if (!resp.ok) {
      if (resp.status === 403) toast('API key invalida o sin permisos', 'error');
      if (resp.status === 429) console.warn('Rate limit alcanzado, esperando...');
      return;
    }

    const data = await resp.json();
    if (!data.matches) return;

    let updated = 0;
    data.matches.forEach(m => {
      if (!m.score || m.score.fullTime.home === null) return;

      const homeTeam = findTeamByApiName(m.homeTeam.name || m.homeTeam.shortName);
      const awayTeam = findTeamByApiName(m.awayTeam.name || m.awayTeam.shortName);
      if (!homeTeam || !awayTeam) return;

      const localMatch = GROUP_MATCHES.find(gm =>
        gm.home.code === homeTeam.code && gm.away.code === awayTeam.code
      );
      if (!localMatch) return;

      const newHome = m.score.fullTime.home;
      const newAway = m.score.fullTime.away;
      const existing = state.results[localMatch.id];

      if (!existing || existing.home !== newHome || existing.away !== newAway) {
        state.results[localMatch.id] = { home: newHome, away: newAway, live: m.status === 'IN_PLAY' || m.status === 'PAUSED' };
        updated++;
      }
    });

    if (updated > 0) {
      saveState();
      syncResults();
      lastFetchTime = new Date();
      toast(`${updated} resultado${updated > 1 ? 's' : ''} actualizado${updated > 1 ? 's' : ''} en vivo!`, 'success');
      render();
    }
    lastFetchTime = new Date();
  } catch(e) {
    console.error('Error fetching live scores:', e);
  }
}

function toast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');

}

function confetti() {
  const colors = ['#ffd700', '#8b1538', '#22c55e', '#3b82f6', '#f97316', '#a855f7'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.width = (Math.random() * 8 + 5) + 'px';

  }
}

async function register() {
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const name = document.getElementById('authName').value.trim();
  const pass = document.getElementById('authPassword').value;
  const pass2 = document.getElementById('authPassword2').value;
  const team = document.getElementById('authTeam').value;

  if (!email || !email.includes('@')) return toast('Ingresa un correo valido', 'error');
  if (!name) return toast('Ingresa tu nombre', 'error');
  if (pass.length < 4) return toast('La clave debe tener minimo 4 caracteres', 'error');
  if (pass !== pass2) return toast('Las claves no coinciden', 'error');

  const isFirstUser = state.users.length === 0;
  const emailKey = email.replace(/\./g, ',');
  const emailStatus = state.approvedEmails[emailKey] || null;

  if (!isFirstUser && emailStatus !== 'approved') {
    return toast('Este correo no esta autorizado. Contacta al admin para que te habilite.', 'error');
  }

  if (state.users.find(u => u.email === email)) {
    return toast('Este correo ya tiene cuenta. Usa Ingresar.', 'error');
  }

  const passHash = await hashPin(pass);
  const user = {
    id: Date.now().toString(),
    name,
    email,
    passHash,
    favTeam: team,
    isAdmin: isFirstUser,
    paid: true,
    createdAt: new Date().toISOString()
  };
  state.users.push(user);
  state.predictions[user.id] = { matches: {}, champion: null, bracket: {} };
  state.currentUser = user;
  saveState();
  syncUser(user);
  syncPrediction(user.id);
  subscribeMyPredictions();
  confetti();
  toast(`Bienvenido ${name}! ${user.isAdmin ? '(Admin)' : ''}`);
  navigate('dashboard');
}

async function login() {
  const email = document.getElementById('authEmail').value.trim().toLowerCase();
  const pass = document.getElementById('authPassword').value;

  if (!email) return toast('Ingresa tu correo', 'error');
  if (!pass) return toast('Ingresa tu clave', 'error');

  const user = state.users.find(u => u.email === email);
  if (!user) return toast('Correo no registrado', 'error');

  const passHash = await hashPin(pass);
  if (user.passHash !== passHash) return toast('Clave incorrecta', 'error');

  state.currentUser = user;
  saveState();
  subscribeMyPredictions();
  toast(`Hola de vuelta, ${user.name}!`);
  navigate('dashboard');
}

async function changePassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;

  if (!oldPass) return toast('Ingresa tu clave actual', 'error');

function formatDayHeader(dt) {
  const d = new Date(dt);
  const s = d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function formatTime(dt) {
  return new Date(dt).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function dayKeyOf(dt) {
  // YYYY-MM-DD en hora LOCAL del usuario (para agrupar bien por dia)
  return dt ? new Date(dt).toLocaleDateString('en-CA') : 'zzz-sin-fecha';
}

function renderMatchCard(m, userPreds) {
  const pred = userPreds.matches[m.id];
  const result = state.results[m.id];
  const locked = isMatchLocked(m);
  const lockInfo = getMatchLockStatus(m);
  const dt = getMatchDate(m);

  // Estado simplificado: un solo indicador, paleta neutra
  let statusHtml = '';
  if (result) statusHtml = '<span class="match-status done">&#10003; Jugado</span>';
  else if (lockInfo.status === 'locked') statusHtml = '<span class="match-status locked">&#128274; Cerrado</span>';
  else if (lockInfo.status === 'closing') statusHtml = '<span class="match-status closing">&#9200; ' + lockInfo.label + '</span>';
  else if (pred) statusHtml = '<span class="match-status done">&#10003; Guardado</span>';
  else statusHtml = '<span class="match-status open">Pendiente</span>';

  return `
    <div class="match-card ${pred ? 'saved' : ''} ${locked ? 'locked' : ''}" id="match-${m.id}">
      <div class="match-meta">
        ${dt ? `<span class="match-time">${formatTime(dt)}</span>` : '<span class="match-time" style="color:var(--text-muted)">--:--</span>'}
        <span class="group-chip">Grupo ${m.group}</span>
        ${statusHtml}
      </div>
      <div class="match-teams">
        <div class="match-team home">
          <span class="flag">${m.home.flag}</span>
          <span class="name">${m.home.name}</span>
        </div>
        <div class="match-score">
          <input type="number" min="0" max="20" id="h-${m.id}" inputmode="numeric"
                 value="${pred ? pred.home : ''}"

          <span class="vs">VS</span>
          <input type="number" min="0" max="20" id="a-${m.id}" inputmode="numeric"
                 value="${pred ? pred.away : ''}"
                 ${locked ? 'disabled' : ''}

        </div>
        <div class="match-team away">
          <span class="flag">${m.away.flag}</span>
          <span class="name">${m.away.name}</span>
        </div>

        <div style="text-align:center;margin-top:8px;font-size:0.8rem;color:var(--text-muted)">
          Resultado: <strong style="color:var(--text)">${result.home} - ${result.away}</strong>
          ${pred ? `<span style="margin-left:10px;color:var(--accent)">+${calcMatchPoints(pred, result, 'groups')} pts</span>` : ''}
        </div>
      ` : ''}
      <div class="match-actions">
        ${locked
          ? `<span style="font-size:0.78rem;color:var(--text-muted)">&#128274; Predicciones cerradas</span>`
          : `<span class="autosave-hint" id="autosave-${m.id}">${pred ? '&#10003; Guardado automaticamente' : 'Escribe el marcador (se guarda solo)'}</span>`
        }

}

function renderPredictions() {
  const raw = state.predictions[state.currentUser.id] || {};
  const userPreds = { matches: normalizeMatches(raw.matches), champion: raw.champion || null, bracket: raw.bracket || {}, championLocked: raw.championLocked || false };
  const groups = Object.keys(GROUPS);
  const filterGroups = state.groupFilter === 'all' ? groups : [state.groupFilter];
  const filteredMatches = GROUP_MATCHES.filter(m => filterGroups.includes(m.group));

  const savedCount = Object.keys(userPreds.matches).length;
  const totalCount = GROUP_MATCHES.length;
  const pct = Math.round((savedCount / totalCount) * 100);

  // Agrupar por dia (en hora local) y ordenar cronologicamente
  const byDay = {};
  filteredMatches.forEach(m => {
    const k = dayKeyOf(getMatchDate(m));
    (byDay[k] = byDay[k] || []).push(m);
  });
  const sortedDays = Object.keys(byDay).sort();
  // dentro de cada dia, ordenar por hora
  sortedDays.forEach(k => byDay[k].sort((a,b) => {
    const da = getMatchDate(a), db = getMatchDate(b);
    return (da ? new Date(da).getTime() : 0) - (db ? new Date(db).getTime() : 0);
  }));

  const daysHtml = sortedDays.map(k => {
    const matches = byDay[k];
    const dt = getMatchDate(matches[0]);
    const header = dt ? formatDayHeader(dt) : 'Fecha por confirmar';
    return `
      <div class="day-group">
        <div class="day-header">
          <span class="day-name">${header}</span>
          <span class="day-count">${matches.length} partido${matches.length !== 1 ? 's' : ''}</span>
        </div>
        <div class="matches-container">
          ${matches.map(m => renderMatchCard(m, userPreds)).join('')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="section-header">
      <h2>Tus <span>Predicciones</span></h2>
      <div style="font-size:0.85rem;color:var(--text-muted)">
        ${savedCount}/${totalCount} partidos (${pct}%)
      </div>
    </div>

    <div class="champion-pick">
      ${renderChampionSection(userPreds)}
    </div>

    <div class="filter-tabs">
      <button class="filter-tab ${state.groupFilter === 'all' ? 'active' : ''}" onclick="filterGroup('all')">Todos</button>
      ${groups.map(g => `
        <button class="filter-tab ${state.groupFilter === g ? 'active' : ''}" onclick="filterGroup('${g}')">Grupo ${g}</button>
      `).join('')}
    </div>

    ${daysHtml}

    <div style="position:sticky;bottom:12px;display:flex;justify-content:center;margin-top:20px;z-index:50">
      <button class="btn btn-gold" style="box-shadow:0 6px 20px rgba(0,0,0,0.35)" onclick="saveAllVisibleGroup()">
        &#128190; Guardar todo
      </button>
    </div>`;
}

function filterGroup(g) {
  state.groupFilter = g;
  render();
}

// Firebase convierte objetos con claves enteras pequenas (0,1,2..) en arrays
// al leerlos. Esto los regresa a objeto {matchId: pred} para que el resto del
// codigo (conteos, guardados, render) sea consistente sin importar como llego.
function normalizeMatches(matches) {
  if (!matches) return {};
  if (Array.isArray(matches)) {
    const obj = {};
    matches.forEach((v, i) => { if (v != null) obj[i] = v; });
    return obj;
  }
  return matches;
}

function ensurePredictions() {
  if (!state.predictions[state.currentUser.id]) {
    state.predictions[state.currentUser.id] = { matches: {}, champion: null, bracket: {}, championLocked: false, bracketLocked: {}, knockout: {} };
  }
  const p = state.predictions[state.currentUser.id];
  p.matches = normalizeMatches(p.matches);
  if (!p.bracket) p.bracket = {};
  if (!p.bracketLocked) p.bracketLocked = {};
  if (!p.knockout) p.knockout = {};
  return p;
}

function pickChampion(code) {
  const preds = ensurePredictions();

  if (preds.championLocked) {
    const current = ALL_TEAMS.find(t => t.code === preds.champion);
    return toast(`Ya elegiste a ${current?.flag} ${current?.name}. No se puede cambiar.`, 'error');
  }

  if (isChampionDeadlinePassed()) {
    return toast('El plazo para elegir campeon ya paso (cierra al iniciar la jornada 2).', 'error');
  }

  const team = ALL_TEAMS.find(t => t.code === code);
  if (!team) return;

  // Show confirmation modal
  const modal = document.createElement('div');
  modal.id = 'champModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)';
  modal.innerHTML = `
    <div style="background:var(--secondary);border:1px solid rgba(212,168,67,0.3);border-radius:var(--radius);padding:2rem;max-width:400px;width:90%;text-align:center">

      <h2 style="margin-bottom:0.5rem">${team.name}</h2>

        <p style="font-size:0.85rem;color:var(--danger);font-weight:600">&#9888; Esta decision es DEFINITIVA</p>
        <p style="font-size:0.78rem;color:var(--text-muted);margin-top:4px">No podras cambiar tu campeon despues. Vale +${POINTS.champion} puntos extra si aciertas.</p>
      </div>

}

function confirmChampion(code) {
  const preds = ensurePredictions();
  preds.champion = code;
  preds.championLocked = true;
  saveState();
  syncPrediction(state.currentUser.id);
  document.getElementById('champModal')?.remove();
  const team = ALL_TEAMS.find(t => t.code === code);
  confetti();
  toast(`${team.flag} ${team.name} es tu campeon! Decision final.`, 'success');
  render();
}

function savePrediction(matchId) {
  const match = GROUP_MATCHES.find(m => m.id === matchId);
  if (match && isMatchLocked(match)) return toast('Predicciones cerradas para este partido (2h antes del inicio)', 'error');
  const h = document.getElementById(`h-${matchId}`);
  const a = document.getElementById(`a-${matchId}`);
  if (h.value === '' || a.value === '') return toast('Ingresa ambos marcadores', 'error');

  if (!state.predictions[state.currentUser.id]) {
    state.predictions[state.currentUser.id] = { matches: {}, champion: null, bracket: {} };
  }
  state.predictions[state.currentUser.id].matches[matchId] = {
    home: parseInt(h.value),
    away: parseInt(a.value)
  };
  saveState();
  syncPrediction(state.currentUser.id);
  toast('Prediccion guardada');

  const card = document.getElementById(`match-${matchId}`);
  if (card) card.classList.add('saved');
}

function saveAllPredictions() {
  const unsaved = document.querySelectorAll('.match-card:not(.saved)');
  let count = 0;
  unsaved.forEach(card => {
    const id = parseInt(card.id.replace('match-', ''));
    const h = document.getElementById(`h-${id}`);
    const a = document.getElementById(`a-${id}`);
    const match = GROUP_MATCHES.find(m => m.id === id);
    if (match && isMatchLocked(match)) return;
    if (h && a && h.value !== '' && a.value !== '') {
      if (!state.predictions[state.currentUser.id]) {
        state.predictions[state.currentUser.id] = { matches: {}, champion: null, bracket: {} };
      }
      state.predictions[state.currentUser.id].matches[id] = {
        home: parseInt(h.value),
        away: parseInt(a.value)
      };
      card.classList.add('saved');
      count++;
    }
  });
  saveState();
  if (count) syncPrediction(state.currentUser.id);
  if (count) toast(`${count} predicciones guardadas!`);
  else toast('No hay predicciones pendientes', 'info');
}

function markUnsaved(matchId) {
  const card = document.getElementById(`match-${matchId}`);
  if (card) card.classList.remove('saved');
}

// Autoguardado de marcadores de grupo.
// CLAVE: en el telefono, si el usuario escribe y cambia de app / bloquea la
// pantalla / navega antes de que termine la espera, el sistema mata el
// temporizador y la prediccion se pierde. Por eso guardamos de forma INMEDIATA
// al salir del campo (onchange/blur) y solo usamos debounce corto mientras teclea.
let autoSaveTimers = {};

// Guarda YA el marcador del partido (sin esperar). Devuelve true si guardo.
function commitGroupPrediction(matchId) {
  const match = GROUP_MATCHES.find(m => m.id === matchId);
  if (match && isMatchLocked(match)) return false;
  const h = document.getElementById(`h-${matchId}`);
  const a = document.getElementById(`a-${matchId}`);
  if (!h || !a || h.value === '' || a.value === '') return false;

  clearTimeout(autoSaveTimers[matchId]);
  const p = ensurePredictions();
  p.matches[matchId] = { home: parseInt(h.value), away: parseInt(a.value) };
  saveState();
  syncPrediction(state.currentUser.id);

  const card = document.getElementById(`match-${matchId}`);
  if (card) card.classList.add('saved');
  const hint = document.getElementById(`autosave-${matchId}`);
  if (hint) { hint.innerHTML = '&#10003; Guardado'; hint.className = 'autosave-hint saved'; }
  return true;
}

// onchange / blur: el usuario termino con el campo -> guardar AL INSTANTE.
function flushSaveGroup(matchId) {
  const h = document.getElementById(`h-${matchId}`);
  const a = document.getElementById(`a-${matchId}`);
  const hint = document.getElementById(`autosave-${matchId}`);
  if (h && a && (h.value === '' || a.value === '')) {
    if (hint) { hint.innerHTML = 'Falta un marcador'; hint.className = 'autosave-hint'; }
    return;
  }
  commitGroupPrediction(matchId);
}

// oninput: mientras teclea -> debounce corto (feedback rapido). El guardado
// definitivo lo garantiza flushSaveGroup al salir del campo.
function autoSaveGroup(matchId) {
  const match = GROUP_MATCHES.find(m => m.id === matchId);
  if (match && isMatchLocked(match)) return;
  const h = document.getElementById(`h-${matchId}`);
  const a = document.getElementById(`a-${matchId}`);
  const hint = document.getElementById(`autosave-${matchId}`);
  if (!h || !a) return;

  if (h.value === '' || a.value === '') {
    if (hint) { hint.innerHTML = 'Escribe ambos marcadores'; hint.className = 'autosave-hint'; }
    return;
  }

  if (hint) { hint.innerHTML = '&#8635; Guardando...'; hint.className = 'autosave-hint saving'; }
  clearTimeout(autoSaveTimers[matchId]);
  autoSaveTimers[matchId] = setTimeout(() => commitGroupPrediction(matchId), 350);
}

// Red de seguridad: si el usuario abandona la pagina o manda la app al fondo
// (cambiar de app, bloquear el telefono), guardar TODO lo pendiente de inmediato.
function flushAllPendingGroupSaves() {
  if (!state.currentUser) return;
  document.querySelectorAll('input[id^="h-"]').forEach(h => {
    const matchId = parseInt(h.id.slice(2));
    if (!isNaN(matchId)) commitGroupPrediction(matchId);
  });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushAllPendingGroupSaves();
});
window.addEventListener('pagehide', flushAllPendingGroupSaves);

// Boton de respaldo: guarda TODAS las predicciones visibles de una vez.
function saveAllVisibleGroup() {
  if (!state.currentUser) return;
  let count = 0;
  document.querySelectorAll('input[id^="h-"]').forEach(h => {
    const matchId = parseInt(h.id.slice(2));
    if (!isNaN(matchId) && commitGroupPrediction(matchId)) count++;
  });
  if (count) toast(`${count} prediccion${count !== 1 ? 'es' : ''} guardada${count !== 1 ? 's' : ''}`, 'success');
  else toast('Escribe algun marcador completo primero', 'info');
}

// ===== BRACKET VIEW =====
// ===== KNOCKOUT ENGINE =====
function calcGroupStandings(group) {
  const teams = GROUPS[group];
  const standings = teams.map(t => ({ ...t, pts: 0, gf: 0, ga: 0, gd: 0, w: 0, d: 0, l: 0 }));

  const groupMatches = GROUP_MATCHES.filter(m => m.group === group);
  let allPlayed = true;

  groupMatches.forEach(m => {
    const result = state.results[m.id];
    if (!result) { allPlayed = false; return; }

    const home = standings.find(s => s.code === m.home.code);
    const away = standings.find(s => s.code === m.away.code);
    if (!home || !away) return;

    home.gf += result.home; home.ga += result.away;
    away.gf += result.away; away.ga += result.home;
    home.gd = home.gf - home.ga;
    away.gd = away.gf - away.ga;

    if (result.home > result.away) { home.pts += 3; home.w++; away.l++; }
    else if (result.home < result.away) { away.pts += 3; away.w++; home.l++; }
    else { home.pts += 1; away.pts += 1; home.d++; away.d++; }
  });

  standings.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  return { standings, allPlayed };
}

function getKnockoutTeams() {
  const allGroups = Object.keys(GROUPS);
  let allComplete = true;
  const firsts = [], seconds = [], thirds = [];

  allGroups.forEach(g => {
    const { standings, allPlayed } = calcGroupStandings(g);
    if (!allPlayed) allComplete = false;
    firsts.push({ ...standings[0], pos: 1, group: g });
    seconds.push({ ...standings[1], pos: 2, group: g });
    thirds.push({ ...standings[2], pos: 3, group: g });
  });

  thirds.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  const bestThirds = thirds.slice(0, 8);

  return { allComplete, firsts, seconds, bestThirds, qualified: [...firsts, ...seconds, ...bestThirds] };
}

function generateKnockoutMatches(qualified) {
  if (qualified.length < 32) return [];
  // Simplified bracket: 1A vs 3C, 2A vs 2B, etc. (FIFA format varies)
  // For now, pair 1st vs best-3rd and 2nd vs 2nd from adjacent groups
  const matches = [];
  for (let i = 0; i < 16; i++) {
    matches.push({
      id: `ko-${i + 1}`,
      round: 'round32',
      home: qualified[i] || null,
      away: qualified[31 - i] || null
    });
  }
  return matches;
}

// ===== KNOCKOUT (ELIMINATORIAS) =====
function deriveWinner(obj, match) {
  // obj tiene h90,a90 y opcionalmente h120,a120,penWinner
  if (obj.h90 == null || obj.a90 == null) return null;
  if (obj.h90 > obj.a90) return match.home.code;
  if (obj.h90 < obj.a90) return match.away.code;
  // empate en 90
  if (obj.h120 != null && obj.a120 != null) {
    if (obj.h120 > obj.a120) return match.home.code;
    if (obj.h120 < obj.a120) return match.away.code;
    // empate en 120 -> penales
    return obj.penWinner || null;
  }
  return null;
}

function calcKnockoutPoints(pred, result, roundId, match) {
  if (!pred || !result || !match) return 0;
  const mult = ROUND_MULTIPLIER[roundId] || 1;
  let pts = 0;

  const predWinner = deriveWinner(pred, match);
  const realWinner = deriveWinner(result, match);

  // 1. Acertar quien pasa
  if (predWinner && realWinner && predWinner === realWinner) pts += KO_POINTS.advance;

  // 2. Marcador exacto 90 min
  if (pred.h90 === result.h90 && pred.a90 === result.a90) pts += KO_POINTS.score90;

  // 3. Alargue: solo si el partido REAL fue a alargue
  const realET = result.h120 != null && result.a120 != null;
  const predET = pred.h120 != null && pred.a120 != null;
  if (realET && predET && pred.h120 === result.h120 && pred.a120 === result.a120) {
    pts += KO_POINTS.score120;
  }

  // 4. Penales: solo si el partido REAL fue a penales
  if (result.penWinner && pred.penWinner && pred.penWinner === result.penWinner) {
    pts += KO_POINTS.penalty;
  }

  return Math.round(pts * mult);
}

function isKoMatchLocked(match) {
  if (!match.datetime) return false;
  const kickoff = new Date(match.datetime).getTime();
  return serverNow() >= (kickoff - LOCK_HOURS * 3600000);
}

function renderBracket() {
  const preds = ensurePredictions();
  const koPreds = preds.knockout || {};
  const { allComplete, qualified } = getKnockoutTeams();

  // Rondas que el admin ya abrio (tienen partidos)
  const openRounds = KNOCKOUT_ROUNDS.filter(r => state.knockout[r.id] && state.knockout[r.id].open && (state.knockout[r.id].matches || []).length > 0);

  let html = '<div class="section-header"><h2>Fase <span>Eliminatoria</span></h2></div>';

  // Banner de estado de grupos
  if (!allComplete) {
    html += '<div style="padding:1.5rem;background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);text-align:center;margin-bottom:1.5rem">';
    html += '<p style="font-size:2rem;margin-bottom:0.5rem">&#9917;</p>';
    html += '<h3 style="margin-bottom:0.5rem">Fase de grupos en curso</h3>';
    html += '<p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem">Los cruces eliminatorios apareceran aqui cuando el admin abra cada ronda (se importan automaticamente de la API o se arman manual).</p>';
    html += '<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap">';
    Object.keys(GROUPS).forEach(g => {
      const { allPlayed } = calcGroupStandings(g);
      html += '<span style="padding:3px 10px;border-radius:12px;font-size:0.72rem;font-weight:600;' + (allPlayed ? 'background:rgba(34,197,94,0.15);color:var(--success)' : 'background:rgba(255,255,255,0.06);color:var(--text-muted)') + '">Grupo ' + g + (allPlayed ? ' &#10003;' : ' ...') + '</span>';
    });
    html += '</div></div>';
  } else {
    html += '<div style="padding:1rem;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius);margin-bottom:1.5rem;font-size:0.85rem;color:var(--success)">&#10003; Fase de grupos completada — ' + qualified.length + ' equipos clasificados</div>';
  }

  if (openRounds.length === 0) {
    html += '<div style="padding:2rem;text-align:center;color:var(--text-muted)"><p style="font-size:2.5rem">&#9203;</p><p>Aun no hay rondas eliminatorias abiertas.</p><p style="font-size:0.82rem">El admin abrira los dieciseisavos cuando se definan los cruces.</p></div>';
    return html;
  }

  // Render de cada ronda abierta
  openRounds.forEach(round => {
    const matches = state.knockout[round.id].matches || [];
    html += '<div style="margin-bottom:1.5rem">';
    html += '<h3 style="font-size:1.05rem;color:var(--accent);margin-bottom:0.8rem">' + round.name + ' <span style="font-size:0.75rem;color:var(--text-muted)">x' + ROUND_MULTIPLIER[round.id] + ' pts</span></h3>';
    html += '<div class="matches-container">';
    matches.forEach(m => {
      html += renderKoMatchCard(m, round.id, koPreds[m.id]);
    });
    html += '</div></div>';
  });

  return html;
}

function renderKoMatchCard(m, roundId, pred) {
  pred = pred || {};
  // Editable hasta 2h antes del partido (igual que grupos). Antes se bloqueaba
  // al guardar (pred.locked), lo que cerraba la prediccion aunque faltaran horas.
  const locked = isKoMatchLocked(m);
  const result = state.knockoutResults[m.id];
  const tie90 = pred.h90 != null && pred.h90 === pred.a90;
  const tie120 = pred.h120 != null && pred.h120 === pred.a120;
  const dis = locked ? 'disabled' : '';

  let h = '<div class="match-card ' + (pred.h90 != null ? 'saved' : '') + ' ' + (locked ? 'locked' : '') + '" id="ko-card-' + m.id + '">';

  // Meta
  h += '<div class="match-meta">';
  h += '<span class="round-badge">' + (m.label || 'Cruce') + '</span>';
  if (m.datetime) h += '<span class="match-datetime">' + formatMatchDate(m.datetime) + '</span>';
  if (result) h += '<span style="color:var(--success);font-size:0.7rem">&#10003; Jugado</span>';
  else if (locked) h += '<span class="lock-badge locked">&#128274; Cerrado</span>';
  else if (pred.h90 != null) h += '<span class="lock-badge approved">&#10003; Guardado (editable)</span>';
  h += '</div>';

  // Equipos + marcador 90
  h += '<div class="match-teams">';
  h += '<div class="match-team home"><span class="flag">' + m.home.flag + '</span><span class="name">' + m.home.name + '</span></div>';
  h += '<div class="match-score">';
  h += '<input type="number" min="0" max="20" id="ko-h90-' + m.id + '" value="' + (pred.h90 != null ? pred.h90 : '') + '" ' + dis + ' onchange="updateKoConditionals(\'' + m.id + '\')" placeholder="-">';
  h += '<span class="vs">90\'</span>';
  h += '<input type="number" min="0" max="20" id="ko-a90-' + m.id + '" value="' + (pred.a90 != null ? pred.a90 : '') + '" ' + dis + ' onchange="updateKoConditionals(\'' + m.id + '\')" placeholder="-">';
  h += '</div>';
  h += '<div class="match-team away"><span class="flag">' + m.away.flag + '</span><span class="name">' + m.away.name + '</span></div>';
  h += '</div>';

  // Bloque alargue (120) - visible si empate en 90
  h += '<div id="ko-et-' + m.id + '" style="' + (tie90 ? '' : 'display:none;') + 'margin-top:10px;padding:10px;background:rgba(212,168,67,0.06);border-radius:var(--radius-sm)">';
  h += '<div style="font-size:0.72rem;color:var(--accent);text-align:center;margin-bottom:6px">&#9203; Tiempo extra (120\')</div>';
  h += '<div class="match-score" style="justify-content:center;gap:10px">';
  h += '<span style="font-size:0.8rem">' + m.home.flag + '</span>';
  h += '<input type="number" min="0" max="20" id="ko-h120-' + m.id + '" value="' + (pred.h120 != null ? pred.h120 : '') + '" ' + dis + ' onchange="updateKoConditionals(\'' + m.id + '\')" placeholder="-">';
  h += '<span class="vs">-</span>';
  h += '<input type="number" min="0" max="20" id="ko-a120-' + m.id + '" value="' + (pred.a120 != null ? pred.a120 : '') + '" ' + dis + ' onchange="updateKoConditionals(\'' + m.id + '\')" placeholder="-">';
  h += '<span style="font-size:0.8rem">' + m.away.flag + '</span>';
  h += '</div></div>';

  // Bloque penales - visible si empate en 120
  h += '<div id="ko-pk-' + m.id + '" style="' + (tie90 && tie120 ? '' : 'display:none;') + 'margin-top:10px;padding:10px;background:rgba(239,68,68,0.06);border-radius:var(--radius-sm)">';
  h += '<div style="font-size:0.72rem;color:var(--danger);text-align:center;margin-bottom:6px">&#129354; Penales — quien gana?</div>';
  h += '<div style="display:flex;gap:8px;justify-content:center">';
  h += '<button type="button" class="btn btn-sm ' + (pred.penWinner === m.home.code ? 'btn-gold' : 'btn-outline') + '" ' + (locked ? 'disabled' : '') + ' onclick="setPenWinner(\'' + m.id + '\',\'' + m.home.code + '\')">' + m.home.flag + ' ' + m.home.name + '</button>';
  h += '<button type="button" class="btn btn-sm ' + (pred.penWinner === m.away.code ? 'btn-gold' : 'btn-outline') + '" ' + (locked ? 'disabled' : '') + ' onclick="setPenWinner(\'' + m.id + '\',\'' + m.away.code + '\')">' + m.away.flag + ' ' + m.away.name + '</button>';
  h += '</div></div>';

  // Resultado oficial + puntos
  if (result) {
    let resTxt = result.h90 + '-' + result.a90 + ' (90\')';
    if (result.h120 != null) resTxt += ', ' + result.h120 + '-' + result.a120 + ' (120\')';
    if (result.penWinner) { const w = ALL_TEAMS.find(t => t.code === result.penWinner); resTxt += ', penales: ' + (w ? w.flag : result.penWinner); }
    h += '<div style="text-align:center;margin-top:8px;font-size:0.78rem;color:var(--text-muted)">Oficial: <strong style="color:var(--text)">' + resTxt + '</strong>';
    if (pred.h90 != null) h += '<span style="margin-left:8px;color:var(--accent)">+' + calcKnockoutPoints(pred, result, roundId, m) + ' pts</span>';
    h += '</div>';
  }

  // Acciones
  h += '<div class="match-actions">';
  if (result) {
    h += '';
  } else if (locked) {
    h += '<span style="font-size:0.78rem;color:var(--danger)">&#128274; Predicciones cerradas</span>';
  } else {
    h += '<button class="btn btn-gold btn-sm" onclick="saveKnockoutPrediction(\'' + m.id + '\',\'' + roundId + '\')">Guardar</button>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

function updateKoConditionals(matchId) {
  const h90 = document.getElementById('ko-h90-' + matchId);
  const a90 = document.getElementById('ko-a90-' + matchId);
  const etBlock = document.getElementById('ko-et-' + matchId);
  const pkBlock = document.getElementById('ko-pk-' + matchId);
  if (!h90 || !a90) return;

  const tie90 = h90.value !== '' && a90.value !== '' && parseInt(h90.value) === parseInt(a90.value);
  if (etBlock) etBlock.style.display = tie90 ? '' : 'none';

  const h120 = document.getElementById('ko-h120-' + matchId);
  const a120 = document.getElementById('ko-a120-' + matchId);
  const tie120 = tie90 && h120 && a120 && h120.value !== '' && a120.value !== '' && parseInt(h120.value) === parseInt(a120.value);
  if (pkBlock) pkBlock.style.display = tie120 ? '' : 'none';
}

// Almacen temporal del ganador de penales antes de guardar
const tempPenWinner = {};
function setPenWinner(matchId, code) {
  tempPenWinner[matchId] = code;
  const m = findKoMatch(matchId);
  if (!m) return;
  // refrescar botones
  const pkBlock = document.getElementById('ko-pk-' + matchId);
  if (pkBlock) {
    const btns = pkBlock.querySelectorAll('button');
    btns[0].className = 'btn btn-sm ' + (code === m.home.code ? 'btn-gold' : 'btn-outline');
    btns[1].className = 'btn btn-sm ' + (code === m.away.code ? 'btn-gold' : 'btn-outline');
  }
}

function findKoMatch(matchId) {
  for (const r of KNOCKOUT_ROUNDS) {
    const rd = state.knockout[r.id];
    if (rd && rd.matches) {
      const m = rd.matches.find(x => x.id === matchId);
      if (m) return m;
    }
  }
  return null;
}

function saveKnockoutPrediction(matchId, roundId) {
  const m = findKoMatch(matchId);
  if (!m) return;
  if (isKoMatchLocked(m)) return toast('Este partido ya esta cerrado (2h antes del inicio).', 'error');

  const h90 = document.getElementById('ko-h90-' + matchId).value;
  const a90 = document.getElementById('ko-a90-' + matchId).value;
  if (h90 === '' || a90 === '') return toast('Ingresa el marcador de los 90 minutos', 'error');

  const pred = { h90: parseInt(h90), a90: parseInt(a90), h120: null, a120: null, penWinner: null };

  if (pred.h90 === pred.a90) {
    // empate en 90 -> requiere 120
    const h120 = document.getElementById('ko-h120-' + matchId).value;
    const a120 = document.getElementById('ko-a120-' + matchId).value;
    if (h120 === '' || a120 === '') return toast('Empate en 90: ingresa el marcador del alargue (120\')', 'error');
    pred.h120 = parseInt(h120);
    pred.a120 = parseInt(a120);
    if (pred.h120 === pred.a120) {
      // empate en 120 -> requiere ganador penales
      const pen = tempPenWinner[matchId];
      if (!pen) return toast('Empate en 120: elige quien gana en penales', 'error');
      pred.penWinner = pen;
    }
  }

  const preds = ensurePredictions();
  // NO se bloquea al guardar: se puede cambiar hasta 2h antes del partido (como grupos).
  preds.knockout[matchId] = pred;
  saveState();
  syncPrediction(state.currentUser.id);
  toast('Prediccion guardada! Puedes cambiarla hasta 2h antes del partido.', 'success');
  render();
}

// ===== LEADERBOARD =====
function calcMatchPoints(pred, result, round) {
  if (!pred || !result) return 0;
  let pts = 0;
  const ph = pred.home, pa = pred.away;
  const rh = result.home, ra = result.away;

  if (ph === rh && pa === ra) {
    pts = POINTS.exact;
  } else if ((ph - pa) === (rh - ra) && Math.sign(ph - pa) === Math.sign(rh - ra)) {
    pts = POINTS.diff_and_winner;
  } else if (Math.sign(ph - pa) === Math.sign(rh - ra)) {
    pts = POINTS.winner_only;
  }

  return Math.round(pts * (ROUND_MULTIPLIER[round] || 1));
}

function calcUserPoints(userId) {
  const preds = state.predictions[userId];
  if (!preds) return 0;
  let total = 0;

  // Puntos de fase de grupos
  for (const [matchId, result] of Object.entries(state.results)) {
    const pred = (preds.matches || {})[matchId];
    const match = GROUP_MATCHES.find(m => m.id === parseInt(matchId));
    if (pred && match) {
      total += calcMatchPoints(pred, result, match.round);
    }
  }

  // Puntos de eliminatorias
  const koPreds = preds.knockout || {};
  for (const [matchId, result] of Object.entries(state.knockoutResults || {})) {
    const pred = koPreds[matchId];
    if (!pred) continue;
    // encontrar el match y su ronda
    for (const r of KNOCKOUT_ROUNDS) {
      const rd = state.knockout[r.id];
      if (rd && rd.matches) {
        const m = rd.matches.find(x => x.id === matchId);
        if (m) { total += calcKnockoutPoints(pred, result, r.id, m); break; }
      }
    }
  }

  // Bonus campeon acertado
  if (preds.champion && state.knockoutResults) {
    const finalRound = state.knockout.final;
    if (finalRound && finalRound.matches && finalRound.matches[0]) {
      const finalResult = state.knockoutResults[finalRound.matches[0].id];
      if (finalResult) {
        const champ = deriveWinner(finalResult, finalRound.matches[0]);
        if (champ && champ === preds.champion) total += POINTS.champion;
      }
    }
  }

  return total;
}

// Cuenta marcadores exactos (grupos + eliminatorias 90') para desempate
function countExactScores(userId) {
  const preds = state.predictions[userId];
  if (!preds) return 0;
  let exact = 0;

  for (const [matchId, result] of Object.entries(state.results)) {
    const pred = (preds.matches || {})[matchId];
    if (pred && pred.home === result.home && pred.away === result.away) exact++;
  }

  const koPreds = preds.knockout || {};
  for (const [matchId, result] of Object.entries(state.knockoutResults || {})) {
    const pred = koPreds[matchId];
    if (pred && pred.h90 === result.h90 && pred.a90 === result.a90) exact++;
  }

  return exact;
}

        h += '<span style="font-size:0.7rem;color:var(--text-muted);margin-left:8px">120\':</span>';
        h += '<input type="number" min="0" id="kor-h120-' + m.id + '" value="' + (res.h120 != null ? res.h120 : '') + '" placeholder="-" style="width:40px;padding:4px;text-align:center;border-radius:6px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);color:var(--text)">';
        h += '<span>-</span>';
        h += '<input type="number" min="0" id="kor-a120-' + m.id + '" value="' + (res.a120 != null ? res.a120 : '') + '" placeholder="-" style="width:40px;padding:4px;text-align:center;border-radius:6px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);color:var(--text)">';
        h += '<select id="kor-pen-' + m.id + '" style="padding:4px;font-size:0.7rem;border-radius:6px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);color:var(--text)">';
        h += '<option value="">Penales: nadie</option>';
        h += '<option value="' + m.home.code + '"' + (res.penWinner === m.home.code ? ' selected' : '') + '>' + m.home.name + '</option>';
        h += '<option value="' + m.away.code + '"' + (res.penWinner === m.away.code ? ' selected' : '') + '>' + m.away.name + '</option>';
        h += '</select>';
        h += '<button class="btn btn-gold btn-sm" style="padding:4px 10px;font-size:0.7rem" onclick="saveKoResult(\'' + m.id + '\')">Guardar</button>';
        h += '</div></div>';
      });
      h += '</div>';
    }

    h += '</div>';
  });

  h += '</div>';
  return h;
}

async function importGroupFixtureFromApi() {
  if (!state.apiKey) return toast('Configura la API key primero', 'error');
  toast('Importando fixture oficial de grupos...', 'info');
  try {
    const resp = await fetch('https://api.football-data.org/v4/competitions/WC/matches?stage=GROUP_STAGE', {
      headers: { 'X-Auth-Token': state.apiKey }
    });
    if (!resp.ok) {
      if (resp.status === 403) return toast('API sin permiso para esta competicion', 'error');
      if (resp.status === 429) return toast('Limite de API alcanzado, espera 1 min', 'error');
      return toast('Error API: ' + resp.status, 'error');
    }
    const data = await resp.json();
    if (!data.matches || data.matches.length === 0) return toast('La API aun no tiene el fixture de grupos', 'info');

    let matched = 0;
    const newDates = {};
    data.matches.forEach(apiM => {
      const home = findTeamByApiName(apiM.homeTeam && (apiM.homeTeam.name || apiM.homeTeam.shortName));
      const away = findTeamByApiName(apiM.awayTeam && (apiM.awayTeam.name || apiM.awayTeam.shortName));
      if (!home || !away || !apiM.utcDate) return;
      // Encontrar el GROUP_MATCH con el mismo par de equipos (en cualquier orden)
      const gm = GROUP_MATCHES.find(m =>
        (m.home.code === home.code && m.away.code === away.code) ||
        (m.home.code === away.code && m.away.code === home.code)
      );
      if (gm) { newDates[gm.id] = apiM.utcDate; matched++; }
    });

    if (matched === 0) return toast('No se pudieron emparejar los partidos (equipos aun por definir?)', 'info');

    state.groupDates = { ...state.groupDates, ...newDates };
    saveState();
    syncGroupDates();
    toast(matched + ' fechas oficiales importadas! El bloqueo ya usa el calendario real.', 'success');
    render();
  } catch(e) {
    console.error(e);
    toast('Error al importar fixture: ' + e.message, 'error');
  }
}

async function importKnockoutFromApi(roundId) {
  if (!state.apiKey) return toast('Configura la API key primero', 'error');
  const round = KNOCKOUT_ROUNDS.find(r => r.id === roundId);
  if (!round) return;

  toast('Importando cruces de ' + round.name + '...', 'info');
  try {
    const resp = await fetch('https://api.football-data.org/v4/competitions/WC/matches?stage=' + round.apiStage, {
      headers: { 'X-Auth-Token': state.apiKey }
    });
    if (!resp.ok) {
      if (resp.status === 403) return toast('API sin permiso para esta competicion', 'error');
      if (resp.status === 429) return toast('Limite de API alcanzado, espera 1 min', 'error');
      return toast('Error API: ' + resp.status, 'error');
    }
    const data = await resp.json();
    if (!data.matches || data.matches.length === 0) {
      return toast('La API aun no tiene cruces para ' + round.name, 'info');
    }

    const matches = [];
    data.matches.forEach((apiM, idx) => {
      const home = findTeamByApiName(apiM.homeTeam && (apiM.homeTeam.name || apiM.homeTeam.shortName));
      const away = findTeamByApiName(apiM.awayTeam && (apiM.awayTeam.name || apiM.awayTeam.shortName));
      if (!home || !away) return; // equipos aun no definidos
      matches.push({
        id: roundId + '_' + (idx + 1),
        round: roundId,
        label: round.name,
        home, away,
        datetime: apiM.utcDate || null
      });
    });

    if (matches.length === 0) {
      return toast('Los equipos de ' + round.name + ' aun no estan definidos en la API', 'info');
    }

    state.knockout[roundId] = { open: state.knockout[roundId] ? state.knockout[roundId].open : false, matches };
    saveState();
    syncKnockout();
    toast(matches.length + ' cruces importados! Recuerda "Abrir ronda".', 'success');
    render();
  } catch(e) {
    console.error(e);
    toast('Error al importar: ' + e.message, 'error');
  }
}

function confirmAddKoMatch(roundId) {
  const homeCode = document.getElementById('koAddHome').value;
  const awayCode = document.getElementById('koAddAway').value;
  const dateVal = document.getElementById('koAddDate').value;
  if (!homeCode || !awayCode) return toast('Selecciona ambos equipos', 'error');
  if (homeCode === awayCode) return toast('Deben ser equipos distintos', 'error');

  const home = ALL_TEAMS.find(t => t.code === homeCode);
  const away = ALL_TEAMS.find(t => t.code === awayCode);
  const round = KNOCKOUT_ROUNDS.find(r => r.id === roundId);

  if (!state.knockout[roundId]) state.knockout[roundId] = { open: false, matches: [] };
  const matches = state.knockout[roundId].matches || [];
  matches.push({
    id: roundId + '_m' + Date.now(),
    round: roundId,
    label: round.name,
    home, away,
    datetime: dateVal ? new Date(dateVal).toISOString() : null
  });
  state.knockout[roundId].matches = matches;
  saveState();
  syncKnockout();
  document.getElementById('koAddModal')?.remove();
  toast('Cruce agregado', 'success');
  render();
}

function removeKoMatch(roundId, matchId) {
  if (!confirm('Eliminar este cruce?')) return;
  const rd = state.knockout[roundId];
  if (!rd) return;
  rd.matches = (rd.matches || []).filter(m => m.id !== matchId);
  saveState();
  syncKnockout();
  toast('Cruce eliminado', 'info');
  render();
}

function toggleKoRoundOpen(roundId) {
  if (!state.knockout[roundId]) return;
  state.knockout[roundId].open = !state.knockout[roundId].open;
  saveState();
  syncKnockout();
  toast(state.knockout[roundId].open ? 'Ronda abierta para predicciones!' : 'Ronda cerrada', state.knockout[roundId].open ? 'success' : 'info');
  render();
}

function saveKoResult(matchId) {
  const h90 = document.getElementById('kor-h90-' + matchId).value;
  const a90 = document.getElementById('kor-a90-' + matchId).value;
  if (h90 === '' || a90 === '') return toast('Ingresa el marcador de 90 min', 'error');

  const res = { h90: parseInt(h90), a90: parseInt(a90), h120: null, a120: null, penWinner: null };
  const h120 = document.getElementById('kor-h120-' + matchId).value;
  const a120 = document.getElementById('kor-a120-' + matchId).value;
  if (h120 !== '' && a120 !== '') {
    res.h120 = parseInt(h120);
    res.a120 = parseInt(a120);
  }
  const pen = document.getElementById('kor-pen-' + matchId).value;
  if (pen) res.penWinner = pen;

  state.knockoutResults[matchId] = res;
  saveState();
  syncKnockoutResults();
  toast('Resultado guardado — puntos recalculados', 'success');
  render();
}

function saveResult(matchId) {
  const h = document.getElementById(`rh-${matchId}`);
  const a = document.getElementById(`ra-${matchId}`);
  if (h.value === '' || a.value === '') return toast('Ingresa ambos marcadores', 'error');

  state.results[matchId] = {
    home: parseInt(h.value),
    away: parseInt(a.value)
  };
  saveState();
  syncResults();
  toast('Resultado guardado — todos los participantes lo veran en tiempo real');
  render();
}

function clearResult(matchId) {
  delete state.results[matchId];
  saveState();
  syncResults();
  toast('Resultado borrado', 'info');
  render();
}

function resetAll() {
  if (confirm('Estas seguro? Se borraran TODOS los datos.')) {
    localStorage.removeItem('pollaMundial2026');
    if (firebaseReady) {
      db.ref().remove().catch(e => console.error(e));

    state = { currentUser: null, users: [], predictions: {}, results: {}, approvedEmails: {}, groupDates: {}, knockout: {}, knockoutResults: {}, view: 'home', groupFilter: 'all' };
    navigate('home');
    toast('Todo reiniciado', 'info');

}

  const totalPrize = state.users.filter(u => u.paid !== false).length * ENTRY_FEE;
  const resultsCount = Object.keys(state.results).length;
  const totalMatches = GROUP_MATCHES.length;

  const champVotes = {};
  state.users.forEach(u => {

    if (champ) champVotes[champ] = (champVotes[champ] || 0) + 1;
  });
  const sortedChamps = Object.entries(champVotes).sort((a, b) => b[1] - a[1]).slice(0, 5);

    const preds = normalizeMatches((state.predictions[u.id] || {}).matches);

      if (!result) return;

        <div class="stat-label">Pozo Total ${CURRENCY}</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${resultsCount}/${totalMatches}</div>
        <div class="stat-label">Partidos Jugados</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${pendingCount}</div>
        <div class="stat-label">Pagos Pendientes</div>
      </div>
    </div>

    <div class="dashboard-grid">

        <div class="prize-amount">$${totalPrize.toLocaleString('es-CO')}</div>
        <div class="prize-detail">${state.users.length} participante${state.users.length !== 1 ? 's' : ''} x $${ENTRY_FEE.toLocaleString('es-CO')} ${CURRENCY}</div>
        <div style="margin-top:1rem;display:flex;justify-content:space-around;font-size:0.78rem;color:var(--text-muted)">
          <div>&#129351; 1er: <strong style="color:var(--accent)">${Math.round(totalPrize * 0.6).toLocaleString('es-CO')}</strong></div>
          <div>&#129352; 2do: <strong style="color:var(--text)">${Math.round(totalPrize * 0.25).toLocaleString('es-CO')}</strong></div>

      ${state.users.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem">No hay usuarios registrados</p>' : `
        <div class="email-list">
          ${state.users.map(u => {
            const role = getUserRole(u);
            const roleInfo = ROLES[role];
            const preds = Object.keys((state.predictions[u.id] || {}).matches || {}).length;
            return `
              <div class="email-row" style="flex-wrap:wrap;gap:8px">
                <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;flex-shrink:0">
                  ${u.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2)}
                </div>
                <div style="flex:1;min-width:120px">
                  <div style="font-weight:600;font-size:0.85rem">${u.name}</div>
                  <div style="font-size:0.72rem;color:var(--text-muted)">${u.email}</div>
                </div>
                <span style="font-size:0.7rem;padding:3px 8px;border-radius:12px;background:${roleInfo.color}22;color:${roleInfo.color};font-weight:600">
                  ${roleInfo.icon} ${roleInfo.label}
                </span>
                <span style="font-size:0.72rem;color:var(--text-muted)">${preds} pred.</span>
                <div class="actions" style="flex-wrap:wrap">
                  <select style="padding:3px 6px;font-size:0.7rem;border-radius:6px;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04);color:var(--text);font-family:inherit;cursor:pointer"
                          onchange="changeUserRole('${u.id}', this.value)">
                    <option value="participante" ${role === 'participante' ? 'selected' : ''}>Participante</option>
                    <option value="editor" ${role === 'editor' ? 'selected' : ''}>Editor</option>
                    <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
                  </select>
                  <button class="btn btn-sm" style="background:rgba(59,130,246,0.8);color:#fff;padding:4px 8px;font-size:0.68rem" onclick="showEditUser('${u.id}')">&#9999; Editar</button>
                  <button class="btn btn-sm" style="background:rgba(139,21,56,0.8);color:#fff;padding:4px 8px;font-size:0.68rem" onclick="adminResetPassword('${u.id}')">&#128273; Reset</button>
                  ${!u.isAdmin ? `<button class="btn btn-sm" style="background:var(--danger);color:#fff;padding:4px 8px;font-size:0.68rem" onclick="deleteUser('${u.id}')">&#128465; Eliminar</button>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>
      `}
    </div>`;
}

function changeUserRole(userId, newRole) {
  const user = state.users.find(u => u.id === userId);
  if (!user) return;

  if (newRole === 'admin') {
    user.isAdmin = true;
    user.role = 'admin';
  } else {
    if (user.id === state.currentUser.id) return toast('No puedes quitarte el admin a ti mismo', 'error');
    user.isAdmin = false;
    user.role = newRole;
  }
  saveState();
  syncUser(user);
  toast(`${user.name} ahora es ${ROLES[newRole].label}`, 'success');
  render();
}

function showEditUser(userId) {
  const user = state.users.find(u => u.id === userId);
  if (!user) return;

  const modal = document.createElement('div');
  modal.id = 'editUserModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)';
  modal.innerHTML = `
    <div style="background:var(--secondary);border:1px solid var(--glass-border);border-radius:var(--radius);padding:2rem;max-width:400px;width:90%">
      <h3 style="margin-bottom:1rem">&#9999; Editar Usuario</h3>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="editUserName" value="${user.name}">
      </div>
      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="editUserEmail" value="${user.email}">
      </div>
      <div class="form-group">
        <label>Equipo favorito</label>
        <select id="editUserTeam">
          <option value="">Sin equipo</option>
          ${ALL_TEAMS.map(t => `<option value="${t.code}" ${user.favTeam === t.code ? 'selected' : ''}>${t.flag} ${t.name}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:1rem">
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('editUserModal').remove()">Cancelar</button>
        <button class="btn btn-gold btn-sm" onclick="saveEditUser('${userId}')">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function saveEditUser(userId) {
  const user = state.users.find(u => u.id === userId);
  if (!user) return;

  const name = document.getElementById('editUserName').value.trim();
  const email = document.getElementById('editUserEmail').value.trim().toLowerCase();
  const team = document.getElementById('editUserTeam').value;

  if (!name) return toast('El nombre no puede estar vacio', 'error');
  if (!email || !email.includes('@')) return toast('Correo invalido', 'error');

  user.name = name;
  user.email = email;
  user.favTeam = team;

  if (user.id === state.currentUser.id) state.currentUser = user;

  saveState();
  syncUser(user);
  document.getElementById('editUserModal')?.remove();
  toast(`${name} actualizado`, 'success');
  render();
}

function deleteUser(userId) {
  const user = state.users.find(u => u.id === userId);
  if (!user) return;
  if (user.isAdmin) return toast('No se puede eliminar al admin', 'error');

  if (!confirm(`Eliminar a ${user.name}? Se borraran sus predicciones.`)) return;

  state.users = state.users.filter(u => u.id !== userId);
  delete state.predictions[userId];
  saveState();
  saveToFirebase(`users/${userId}`, null);
  saveToFirebase(`predictions/${userId}`, null);
  toast(`${user.name} eliminado`, 'info');
  render();
}

// ===== RENDER =====
// Convierte los emojis del DOM en imagenes (banderas visibles en Windows).
// Idempotente: los ya convertidos son <img>, no texto, asi que se ignoran.
function twemojiParse() {
  if (window.twemoji) {
    twemoji.parse(document.body, {
      base: 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/',
      folder: 'svg',
      ext: '.svg'
    });
  }
}

function render() {
  const app = document.getElementById('app');
  renderNav();

  if (!state.currentUser) {
    app.innerHTML = renderAuth();
    twemojiParse();
    return;
  }

  switch (state.view) {
    case 'home':
    case 'dashboard':
      app.innerHTML = renderDashboard();
      break;
    case 'groups':
      app.innerHTML = renderGroups();
      break;
    case 'predictions':
      app.innerHTML = renderPredictions();
      break;
    case 'bracket':
      app.innerHTML = renderBracket();
      break;
    case 'leaderboard':
      app.innerHTML = renderLeaderboard();
      break;
    case 'rules':
      app.innerHTML = renderRules();
      break;
    case 'admin':
      app.innerHTML = renderAdmin();
      break;
    default:
      app.innerHTML = renderDashboard();
  }

  twemojiParse();
}

// ===== INIT =====
loadState();
render();
</script>
</body>
</html>
